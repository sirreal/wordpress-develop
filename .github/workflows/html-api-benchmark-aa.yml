name: HTML API benchmark A/A

# Measures the noise of tests/performance/html-api/bench.php on GitHub-hosted runners.
# Both trees are the same checkout, so every difference the report shows is noise.
# Each job runs all of its A/A runs back to back on one runner, so differences
# between the runs in a job are not differences between machines.
on:
  push:
    branches:
      - html-api/benchmark-ci-aa
  workflow_dispatch:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Runs six A/A benchmarks with the tracing JIT over the synthetic documents.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Sets up PHP.
  # - Logs the runner's CPU and PHP configuration.
  # - Runs the A/A benchmarks and writes the reports to the job summary.
  # - Uploads the full JSON results and the CPU description.
  aa:
    name: A/A on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-24.04', 'ubuntu-24.04-arm' ]
    defaults:
      run:
        shell: bash
    env:
      RESULT: aa-${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Log runner information
        run: |
          mkdir -p "$RESULT"
          lscpu | tee "$RESULT/lscpu.txt"
          php --version
          php -i | grep -E '^opcache\.(enable|enable_cli|jit|jit_buffer_size) '
          {
            echo '### Runner'
            echo '```'
            grep -E '^(Model name|CPU\(s\)):' "$RESULT/lscpu.txt"
            php --version | head -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the A/A benchmarks
        run: |
          for run in 1 2 3 4 5 6; do
            echo "## Run ${run}" >> "$GITHUB_STEP_SUMMARY"
            php tests/performance/html-api/bench.php \
              --base . \
              --head . \
              --no-corpus \
              --jit \
              --format markdown \
              --save "$RESULT/run-${run}.json" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the results
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RESULT }}
          path: ${{ env.RESULT }}
          if-no-files-found: error
