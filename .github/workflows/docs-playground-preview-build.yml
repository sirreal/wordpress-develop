name: Code Reference Playground Preview Build

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
    types: [ labeled, synchronize ]

# Pull-request code receives no write authority or repository secrets.
permissions: {}

jobs:
  build:
    name: Build Code Reference snapshot
    # Fork pull_request runs cannot read the base repository's Actions variables.
    # This allowlisted job is untrusted and read-only; every trusted staging job
    # remains gated by DOCS_PREVIEW_STAGING.
    if: >-
      github.event_name == 'pull_request' &&
      ( github.repository == 'WordPress/wordpress-develop' ||
        github.repository == 'sirreal/wordpress-develop' ) &&
      github.event.pull_request.base.ref == 'trunk' &&
      github.event.pull_request.state == 'open' &&
      ( ( github.event.action == 'labeled' && github.event.label.name == 'docs-preview' ) ||
        ( github.event.action == 'synchronize' && contains( github.event.pull_request.labels.*.name, 'docs-preview' ) ) )
    # A newer eligible head makes every older build obsolete for this pull request.
    concurrency:
      group: docs-preview-build-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      HANDOFF_DIRECTORY: ${{ github.workspace }}/handoff
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Set up the pinned Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.github/docs-playground-preview/.nvmrc'

      # A re-run is a request for a fresh build, so it never reuses a snapshot.
      - name: Reuse a healthy public snapshot for the same SHA
        id: reuse
        if: ${{ github.run_attempt == 1 }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/docs-playground-preview/reuse.mjs "$HANDOFF_DIRECTORY"

      - name: Set up the pinned PHP and Composer versions
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:2.8.12
          coverage: none

      - name: Resolve the exact build and cache identity
        id: resolve
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        run: >-
          npm --prefix .github/docs-playground-preview run build --
          --resolve-only
          --runner-image ubuntu-24.04
          --cache-root "$RUNNER_TEMP/docs-preview-cache"
          --inputs-output "$RUNNER_TEMP/docs-preview-resolved-inputs.json"
          --handoff "$HANDOFF_DIRECTORY"

      - name: Restore the exact invariant site base
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.resolve.outputs.cache-directory }}
          key: ${{ steps.resolve.outputs.cache-key }}

      # Administrator: enable enforcement in Settings > Secrets and variables >
      # Actions > Variables by creating or updating DOCS_PREVIEW_ENFORCE to true.
      - name: Build and validate the Code Reference snapshot
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        env:
          DOCS_PREVIEW_ENFORCE: ${{ vars.DOCS_PREVIEW_ENFORCE }}
        run: >-
          npm --prefix .github/docs-playground-preview run build --
          --source-repository "$SOURCE_REPOSITORY"
          --source-sha "$SOURCE_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --runner-image ubuntu-24.04
          --cache-root "$RUNNER_TEMP/docs-preview-cache"
          --work-root "$RUNNER_TEMP/docs-preview-work"
          --resolved-inputs "$RUNNER_TEMP/docs-preview-resolved-inputs.json"
          --handoff "$HANDOFF_DIRECTORY"

      - name: Upload the terminal publisher handoff
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HANDOFF_DIRECTORY }}
          if-no-files-found: error
          retention-days: 1

  build-trunk:
    name: Build trunk Code Reference snapshot
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/trunk' &&
      ( github.repository == 'WordPress/wordpress-develop' ||
        ( github.repository == 'sirreal/wordpress-develop' && vars.DOCS_PREVIEW_STAGING == 'true' ) )
    concurrency:
      group: docs-preview-build-trunk
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HANDOFF_DIRECTORY: ${{ github.workspace }}/handoff
    steps:
      - name: Check out the exact trunk commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Set up the pinned Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.github/docs-playground-preview/.nvmrc'

      - name: Set up the pinned PHP and Composer versions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:2.8.12
          coverage: none

      - name: Resolve the exact build and cache identity
        id: resolve
        run: >-
          npm --prefix .github/docs-playground-preview run build --
          --resolve-only
          --runner-image ubuntu-24.04
          --cache-root "$RUNNER_TEMP/docs-preview-cache"
          --inputs-output "$RUNNER_TEMP/docs-preview-resolved-inputs.json"
          --handoff "$HANDOFF_DIRECTORY"

      - name: Restore the exact invariant site base
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.resolve.outputs.cache-directory }}
          key: ${{ steps.resolve.outputs.cache-key }}

      # Administrator: enable enforcement in Settings > Secrets and variables >
      # Actions > Variables by creating or updating DOCS_PREVIEW_ENFORCE to true.
      - name: Build and validate the trunk Code Reference snapshot
        env:
          DOCS_PREVIEW_ENFORCE: ${{ vars.DOCS_PREVIEW_ENFORCE }}
        run: >-
          npm --prefix .github/docs-playground-preview run build --
          --source-repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --runner-image ubuntu-24.04
          --cache-root "$RUNNER_TEMP/docs-preview-cache"
          --work-root "$RUNNER_TEMP/docs-preview-work"
          --resolved-inputs "$RUNNER_TEMP/docs-preview-resolved-inputs.json"
          --handoff "$HANDOFF_DIRECTORY"

      - name: Upload the terminal trunk publisher handoff
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview-trunk-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HANDOFF_DIRECTORY }}
          if-no-files-found: error
          retention-days: 1
